<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eichhörnchen-Quiz</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#3e2b1e;background:linear-gradient(#bde8f4 0 17%,#dcefc0 45%,#b9df83);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 8%,#fff9 0 3%,transparent 4%),radial-gradient(circle at 88% 11%,#fff7 0 4%,transparent 5%)}
.app{max-width:1180px;margin:auto;padding:18px}.wood{background:linear-gradient(90deg,#d5a96e,#edca91,#d9aa6e);border:3px solid #9b693b;border-radius:14px;box-shadow:0 5px 10px #4a2d1728,inset 0 0 18px #fff6}
header{max-width:800px;margin:5px auto 18px;text-align:center;padding:10px 22px;position:relative}h1{font-size:clamp(38px,6vw,64px);margin:0}.tag{font-size:24px;margin-top:2px}.squirrel{position:absolute;right:-105px;top:-8px;font-size:88px}
.menu{background:#fffdf7eF;border-radius:24px;padding:15px;box-shadow:0 6px 18px #4d35152b;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.topic{border:0;border-radius:16px;padding:13px 5px;min-height:100px;font-weight:bold;font-size:16px;box-shadow:0 4px 8px #0002;cursor:pointer;color:#352718}.topic span{display:block;font-size:34px;margin-bottom:4px}.topic:nth-child(1){background:#8bd06e}.topic:nth-child(2){background:#f5ad55}.topic:nth-child(3){background:#ed7b72}.topic:nth-child(4){background:#74c6ed}.topic:nth-child(5){background:#f4cf5e}.topic:nth-child(6){background:#b79ae5}
.panel{background:#fffef9;border:4px solid #fff;border-radius:24px;box-shadow:0 8px 22px #3c2a1730;padding:18px}.quiz{border:3px solid #70ad53;border-radius:20px;padding:20px;background:#fff}
.topline{display:flex;align-items:center;gap:13px}.badge{width:55px;height:55px;border-radius:14px;background:#6eb44e;color:white;display:grid;place-items:center;font-size:28px;font-weight:bold}.name{font-size:28px;font-weight:900}.dots{margin-left:auto;letter-spacing:5px;color:#d6d6c9}.dots b{color:#65ac4a}
.q{font-size:clamp(25px,4vw,38px);font-weight:900;margin:22px 0 16px}.answers{display:grid;gap:11px}.ans{background:#fff;border:2px solid #ddd5c8;border-radius:15px;padding:13px;text-align:left;font-size:21px;cursor:pointer;display:flex;gap:12px;align-items:center}.letter{background:#68b34e;color:#fff;border-radius:10px;padding:5px 11px;font-weight:900}.ans.good{background:#dcf3d4;border-color:#65ac4a}.ans.bad{background:#ffe0dc;border-color:#d7685d}.feedback{margin-top:14px;background:#f3f5e8;border-radius:14px;padding:12px 15px;min-height:50px;font-size:18px}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}.btn{border:0;border-radius:13px;padding:12px 20px;font-weight:900;font-size:18px;cursor:pointer}.home{background:#3995d1;color:#fff}.next{background:#f4bd3e}.prev{background:#ece9e0}.count{font-weight:bold;color:#6e6459}.footer{text-align:center;margin:17px 0 4px;font-size:18px}.finish{text-align:center;padding:35px}.finish .big{font-size:80px}
@media(max-width:760px){.menu{grid-template-columns:repeat(3,1fr)}.squirrel{display:none}.app{padding:9px}.panel{padding:8px}.quiz{padding:14px}.tag{font-size:19px}.topic{min-height:86px}.controls{flex-wrap:wrap}}
</style></head><body><div class="app">
<header class="wood"><h1>Eichhörnchen-Quiz</h1><div class="tag">Wie gut kennst du dich aus?</div><div class="squirrel">🐿️</div></header>
<div class="menu" id="menu"></div><main class="panel"><div class="quiz" id="quiz"></div></main>
<div class="footer">🐿️ Du schaffst das! &nbsp; 🐾 &nbsp; Viel Freude beim Lernen!</div></div>
<script>
const data=[
["Lebensraum","🍃","Wo leben europäische Eichhörnchen besonders gern?",["In Gärten, Parks und Wäldern","Nur auf Wiesen","Nur in Häusern"],0,"Hohe Bäume bieten Nahrung, Verstecke und Platz für den Kobel."],
["Lebensraum","🌳","Warum sind hohe Bäume für Eichhörnchen wichtig?",["Dort können sie klettern und sich verstecken.","Dort können sie schwimmen.","Dort ist es immer warm."],0,"Genau! Dort können sie gut klettern und sich vor Feinden verstecken."],
["Ernährung","🌰","Was gehört zur Nahrung des Eichhörnchens?",["Nüsse, Samen, Beeren und Pilze","Nur Gras","Nur Nüsse"],0,"Richtig! Auch Knospen, Früchte, Insekten und manchmal Vogeleier gehören dazu."],
["Ernährung","🍂","Warum versteckt das Eichhörnchen im Herbst Nahrung?",["Damit es im Winter Vorräte findet.","Damit andere Tiere sie fressen.","Weil es sie nicht mag."],0,"Im Winter wacht es immer wieder auf und sucht seine Vorräte."],
["Kobel","🏠","Wie heißt das Nest des Eichhörnchens?",["Kobel","Horst","Höhle"],0,"Das Nest des Eichhörnchens heißt Kobel."],
["Winter","❄️","Was macht das Eichhörnchen im Winter?",["Es hält Winterruhe.","Es hält durchgehend Winterschlaf.","Es fliegt in den Süden."],0,"Bei der Winterruhe schläft es viel, wacht aber zum Fressen auf."],
["Körperbau","🐾","Wozu dient der buschige Schwanz?",["Zum Steuern, Balancieren und Wärmen","Nur als Schmuck","Nur zum Graben"],0,"Der Schwanz hilft beim Steuern und Balancieren und kann wie eine Decke wärmen."],
["Körperbau","🦷","Was ist besonders an den Nagezähnen?",["Sie wachsen regelmäßig nach.","Sie fallen jeden Winter aus.","Sie sind weich."],0,"Die Nagezähne wachsen regelmäßig nach."],
["Nachwuchs","🐣","Wie kommen junge Eichhörnchen zur Welt?",["Nackt, blind und taub","Mit dichtem Fell","Schon selbstständig"],0,"Die Jungen sind zuerst nackt, blind und taub und brauchen ihre Mutter."],
["Nachwuchs","🐿️","Wann sind die Jungen ungefähr selbstständig?",["Mit etwa vier Monaten","Nach zwei Tagen","Erst mit drei Jahren"],0,"Nach ungefähr vier Monaten sind sie selbstständig."],
["Feinde","🦉","Welches Tier kann ein Feind des Eichhörnchens sein?",["Baummarder","Regenwurm","Schmetterling"],0,"Baummarder gehören zu den natürlichen Feinden des Eichhörnchens."],
["Denkaufgabe","💡","Ein Eichhörnchen wacht im Winter hungrig auf. Was tut es wahrscheinlich?",["Es sucht ein Futterversteck.","Es wartet hungrig bis zum Frühling.","Es fliegt in den Süden."],0,"Sehr gut gedacht! Es sucht seine versteckten Vorräte."]
];
const groups=[["Lebensraum","🍃"],["Ernährung","🌰"],["Kobel","🏠"],["Winter","❄️"],["Körperbau","🐾"],["Denkaufgabe","💡"]];
let i=0,score=0,done=false;
function menu(){document.getElementById("menu").innerHTML=groups.map((g,n)=>`<button class="topic" onclick="jump('${g[0]}')"><span>${g[1]}</span>${n+1}<br>${g[0]}</button>`).join("")}
function jump(g){let x=data.findIndex(q=>q[0]===g);if(x>=0){i=x;done=false;render()}}
function render(){let e=document.getElementById("quiz");if(i>=data.length){e.innerHTML=`<div class="finish"><div class="big">🐿️🌟</div><h2>Super – geschafft!</h2><p>Du hast <b>${score} von ${data.length}</b> Fragen richtig beantwortet.</p><p>${score>=10?"Du bist ein echter Eichhörnchen-Profi!":score>=7?"Du weißt schon richtig viel!":"Schau dir schwierige Themen noch einmal an und probiere es erneut."}</p><button class="btn next" onclick="restart()">Neue Runde</button></div>`;return}
let q=data[i], letters=["A","B","C"];let dots=data.map((_,n)=>n===i?"<b>●</b>":"●").join("");
e.innerHTML=`<div class="topline"><div class="badge">${i+1}</div><div class="name">${q[1]} ${q[0]}</div><div class="dots">${dots}</div></div><div class="q">${q[2]}</div><div class="answers">${q[3].map((a,j)=>`<button class="ans" onclick="pick(${j},this)"><span class="letter">${letters[j]}</span>${a}</button>`).join("")}</div><div class="feedback" id="fb">💭 Denke erst nach. Tippe dann auf deine Antwort.</div><div class="controls"><button class="btn home" onclick="restart()">⌂ Start</button><button class="btn prev" onclick="back()">‹ Zurück</button><span class="count">Frage ${i+1} von ${data.length}</span><button class="btn next" onclick="next()">Nächste Frage →</button></div>`}
function pick(j,b){if(done)return;done=true;let q=data[i],all=[...document.querySelectorAll(".ans")];if(j===q[4]){score++;b.classList.add("good");document.getElementById("fb").innerHTML="✅ <b>Richtig!</b> "+q[5]}else{b.classList.add("bad");all[q[4]].classList.add("good");document.getElementById("fb").innerHTML="💡 <b>Schau noch einmal:</b> "+q[5]}}
function next(){if(!done){document.getElementById("fb").innerHTML="☝️ Wähle zuerst eine Antwort aus.";return}i++;done=false;render()}
function back(){if(i>0){i--;done=false;render()}}
function restart(){i=0;score=0;done=false;render()}menu();render();
</script></body></html>
